// ── Categorías de ingreso ────────────────────────────────────────────────────
// El campo "categoria" del ingreso usa exactamente estos 4 nombres (Luna también).
const CATS_ING = [
  {k:"Uñas",     ic:"💅", c:"#ec4899", kw:["capping","kaping","kapping","semi","soft gel","softgel","polygel","esmalt","uña"]},
  {k:"Facial",   ic:"✨", c:"#a78bfa", kw:["limpieza","peeling","lifting","perfilado","laminado","facial"]},

];
// minúsculas y sin tildes, pero conserva la ñ (así "uña" no se confunde con el artículo "una")
const sinTildes = s => String(s==null?"":s).toLowerCase().replace(/ñ/g,"\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\u0001/g,"ñ");
// para buscar: además la ñ cuenta como n, así "unas" encuentra "uñas"
const normBusq = s => sinTildes(s).replace(/ñ/g,"n").replace(/\s+/g," ").trim();
// categorías que podrían corresponder a un servicio, según su nombre (0, 1 o varias)
const candidatosCat = srv => {
  const t = sinTildes(srv);
  if(!t.trim()) return [];
  if(t.includes("mely")) return ["Mely"];
  return CATS_ING.filter(c=>c.k!=="Mely"&&c.kw.some(w=>t.includes(w))).map(c=>c.k);
};
const canonCat = v => { if(!v) return ""; const t=normBusq(v); const c=CATS_ING.find(x=>normBusq(x.k)===t); return c?c.k:String(v); };
const catInfo = k => CATS_ING.find(c=>c.k===k)||{k,ic:"🏷️",c:"#94a3b8"};
// categoría que se muestra: la guardada, o la deducida del nombre (sin guardar) si hay una sola posible
const catEfectiva = i => {
  if(i.categoria) return {k:canonCat(i.categoria),guardada:true};
  const c = candidatosCat(i.servicio);
  return c.length===1 ? {k:c[0],guardada:false} : {k:"",guardada:false,dudas:c};
};

const arrowClr = (p,inv=false) => p===null?"#64748b":(p>0?(inv?"#ef4444":"#22c55e"):(p<0?(inv?"#22c55e":"#ef4444"):"#94a3b8"));
const hr = h => { try{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `${r},${g},${b}`;}catch{return "245,158,11";} };

// NUBE (Firebase)
// Cada ingreso y cada gasto se guarda como un documento aparte, así Luna puede
// sumar un ingreso sin tocar el resto. Perfiles, clientes, notas y ajustes van
// juntos en un documento "main". El localStorage queda como copia en el celu.
// ════════════════════════════════════════════════════════════════════════════
firebase.initializeApp({

const fdb = firebase.firestore();
fdb.enablePersistence({ synchronizeTabs: true }).catch(() => {});

const nubeRefs = uidUser => {
  const base = fdb.collection("usuarios").doc(uidUser);
  return { meta: base.collection("rendix_meta").doc("main"), ing: base.collection("rendix_ing"), gast: base.collection("rendix_gast") };
};
// Firestore no acepta "undefined": se limpia pasando por JSON
const limpio = o => JSON.parse(JSON.stringify(o));
const metaDe = d => { const { ing, gast, ...m } = d; return limpio(m); };
const estable = v => {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(estable).join(",") + "]";
  return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + estable(v[k])).join(",") + "}";
};
const mapaDe = lista => new Map(lista.map(x => [String(x.id), estable(limpio(x))]));
const leerLocal = () => { try { const s = localStorage.getItem("rendix_v5"); return s ? JSON.parse(s) : INIT; } catch { return INIT; } };

// Escribe en lotes (Firestore permite hasta 500 operaciones por lote)
async function escribirLotes(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = fdb.batch();
    ops.slice(i, i + 400).forEach(op => op(b));
    await b.commit();
  }
}

// Sube solo lo que cambió respecto de lo último guardado en la nube
async function guardarNube(refs, guardado, d) {
  const ops = [];
  const m = metaDe(d), ms = estable(m);
  if (guardado.meta !== ms) { ops.push(b => b.set(refs.meta, m)); guardado.meta = ms; }
  for (const [lista, col, mapa] of [[d.ing, refs.ing, guardado.ing], [d.gast, refs.gast, guardado.gast]]) {
    const ids = new Set();
    for (const x of lista || []) {
      const id = String(x.id); ids.add(id);
      const limpioX = limpio(x), js = estable(limpioX);
      if (mapa.get(id) !== js) { ops.push(b => b.set(col.doc(id), limpioX)); mapa.set(id, js); }
    }
    for (const id of Array.from(mapa.keys())) {
      if (!ids.has(id)) { ops.push(b => b.delete(col.doc(id))); mapa.delete(id); }
    }
  }
  if (ops.length) await escribirLotes(ops);
}

const getCiclo = (dc,off=0) => {
  const hoy=new Date(),d=dc||1;
  const cut=new Date(hoy.getFullYear(),hoy.getMonth(),d);
  let ini=hoy>=cut?new Date(hoy.getFullYear(),hoy.getMonth(),d):new Date(hoy.getFullYear(),hoy.getMonth()-1,d);
  ini=new Date(ini); ini.setMonth(ini.getMonth()+off);
  const fin=new Date(ini); fin.setMonth(fin.getMonth()+1); fin.setDate(fin.getDate()-1);
  return {desde:isoOf(ini),hasta:isoOf(fin),ini,fin};
};
const lblCiclo = c => `${c.ini.getDate()}/${c.ini.getMonth()+1} — ${c.fin.getDate()}/${c.fin.getMonth()+1}`;

const INIT = {emps:[{id:"e1",nombre:"Mi Emprendimiento",color:"#f59e0b",icon:"💼",meta:0}],ing:[],gast:[],clientes:[],notas:{},activeEmp:"e1",onboarded:false,diaCorte:1,theme:"dark"};

// ── DONUT ────────────────────────────────────────────────────────────────────
function Donut({segs,size=130,sw=18}) {
  const r=(size-sw)/2,ci=2*Math.PI*r,tot=segs.reduce((s,g)=>s+g.v,0)||1;
  let off=0;
  return React.createElement("svg",{width:size,height:size,style:{transform:"rotate(-90deg)"}},
    React.createElement("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"rgba(255,255,255,0.06)",strokeWidth:sw}),
    ...segs.map((sg,i)=>{
      const dash=(sg.v/tot)*ci,gap=ci-dash;
      const el=React.createElement("circle",{key:i,cx:size/2,cy:size/2,r,fill:"none",stroke:sg.c,strokeWidth:sw,strokeDasharray:`${dash} ${gap}`,strokeDashoffset:-off,strokeLinecap:"round"});
      off+=dash; return el;
    })
  );
}

// ── AREA CHART ───────────────────────────────────────────────────────────────
function Area({data,color}) {
  if(!data||data.length<2) return null;
  const W=300,H=70,max=Math.max(...data.map(d=>d.v),1);
  const pts=data.map((d,i)=>({x:(i/(data.length-1))*W,y:H-((d.v/max)*(H-10))-5}));
  const line=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`C${pts[i-1].x+(pts[i].x-pts[i-1].x)/2},${pts[i-1].y} ${pts[i-1].x+(pts[i].x-pts[i-1].x)/2},${p.y} ${p.x},${p.y}`).join(" ");
  const area=`${line} L${W},${H} L0,${H} Z`;
  const id=`g${color.replace("#","")}`;
  return React.createElement("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none",style:{display:"block"}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:color,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:color,stopOpacity:"0.02"})
      )
    ),
    React.createElement("path",{d:area,fill:`url(#${id})`}),
    React.createElement("path",{d:line,fill:"none",stroke:color,strokeWidth:"2.5",strokeLinecap:"round"}),
    ...pts.map((p,i)=>data[i].today?React.createElement("circle",{key:i,cx:p.x,cy:p.y,r:4,fill:color,stroke:"#080c14",strokeWidth:2}):null).filter(Boolean)
  );
}

// ════════════════════════════════════════════════════════════════════════════
function App({user}) {
  const [data,setData]=useState(()=>{try{const s=localStorage.getItem("rendix_v5");return s?JSON.parse(s):INIT;}catch{return INIT;}});
  const [nube,setNube]=useState("cargando"); // cargando | lista | error
  const nubeRef=useRef({listo:false,refs:null,guardado:{meta:null,ing:new Map(),gast:new Map()}});
  const [tab,setTab]=useState("inicio");
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [prefillDate,setPrefillDate]=useState(null);
  const [cOff,setCOff]=useState(0);
  const [cmpOff,setCmpOff]=useState(-1);
  const [toast,setToast]=useState(null);
  const [timer,setTimer]=useState({running:false,elapsed:0});
  const timerRef=useRef(null);
  const [ficha,setFicha]=useState(null); // clienta abierta en la ficha (solo pantalla)
  const [busq,setBusq]=useState({q:"",cat:"todas",rango:"ciclo",desde:"",hasta:"",rev:false,pag:1}); // filtros del buscador (solo pantalla)

  useEffect(()=>{try{localStorage.setItem("rendix_v5",JSON.stringify(data));}catch{}},[data]);

  // ── Nube: carga inicial, subida de datos del dispositivo y actualización en vivo ──
  useEffect(()=>{
    let cancelado=false; const desuscribir=[];
    const n=nubeRef.current; n.listo=false; n.refs=nubeRefs(user.uid);
    (async()=>{
      try{
        const r=n.refs;
        const [mS,iS,gS]=await Promise.all([r.meta.get(),r.ing.get(),r.gast.get()]);
        if(cancelado) return;
        const local=leerLocal();
        const tieneLocal=(local.ing||[]).length>0||(local.gast||[]).length>0||!!local.onboarded;
        if(tieneLocal){try{localStorage.setItem("rendix_v5_respaldo",JSON.stringify(local));}catch{}}

        if(!mS.exists){
          // Cuenta nueva en la nube: si este dispositivo tiene datos, se suben todos
          if(tieneLocal){
            n.guardado={meta:null,ing:new Map(),gast:new Map()};
            await guardarNube(r,n.guardado,local);
            showToast(`Subí ${(local.ing||[]).length} ingresos y ${(local.gast||[]).length} gastos a tu cuenta ☁️`);
          }
          setData(local);
        }else{
          const nubeData={...INIT,...mS.data(),ing:iS.docs.map(x=>x.data()),gast:gS.docs.map(x=>x.data())};
          n.guardado={meta:estable(metaDe(nubeData)),ing:mapaDe(nubeData.ing),gast:mapaDe(nubeData.gast)};
          // ¿Este dispositivo tiene movimientos que no están en la nube?
          const faltIng=(local.ing||[]).filter(i=>!n.guardado.ing.has(String(i.id)));
          const faltGast=(local.gast||[]).filter(g=>!n.guardado.gast.has(String(g.id)));
          if((faltIng.length||faltGast.length)&&window.confirm(`Este dispositivo tiene ${faltIng.length} ingresos y ${faltGast.length} gastos que no están en tu cuenta. ¿Los subo?\n\n(Si decís que no, quedan guardados como respaldo en este dispositivo.)`)){
            nubeData.ing=[...nubeData.ing,...faltIng]; nubeData.gast=[...nubeData.gast,...faltGast];
            await guardarNube(r,n.guardado,nubeData);
          }
          setData(nubeData);
        }
        if(cancelado) return;
        n.listo=true; setNube("lista");

        // En vivo: cambios desde otro dispositivo o desde Luna
        desuscribir.push(r.meta.onSnapshot(s=>{
          if(s.metadata.hasPendingWrites||!s.exists) return;
          const m=s.data(); n.guardado.meta=estable(limpio(m));
          setData(d=>({...INIT,...m,ing:d.ing,gast:d.gast}));
        }));
        desuscribir.push(r.ing.onSnapshot(q=>{
          if(q.metadata.hasPendingWrites) return;
          const lista=q.docs.map(x=>x.data()); n.guardado.ing=mapaDe(lista);
          setData(d=>({...d,ing:lista}));
        }));
        desuscribir.push(r.gast.onSnapshot(q=>{
          if(q.metadata.hasPendingWrites) return;
          const lista=q.docs.map(x=>x.data()); n.guardado.gast=mapaDe(lista);
          setData(d=>({...d,gast:lista}));
        }));
      }catch(e){
        console.error("Rendix nube",e);
        if(!cancelado){setNube("error");showToast("Sin conexión con la nube: guardo en el dispositivo","warn");}
      }
    })();
    return()=>{cancelado=true;nubeRef.current.listo=false;desuscribir.forEach(f=>f());};
  },[user.uid]);

  // ── Nube: guardar solo lo que cambió ──
  useEffect(()=>{
    const n=nubeRef.current;
    if(!n.listo) return;
    guardarNube(n.refs,n.guardado,data).catch(e=>{console.error("Rendix guardar",e);showToast("No pude guardar en la nube","warn");});
  },[data]);
  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2600);};
  const upd=useCallback(fn=>setData(p=>({...p,...fn({...p})})),[]);
  const emp=data.emps.find(e=>e.id===data.activeEmp)||data.emps[0];
  const isDark=data.theme!=="light";
  const ec=emp?.color||"#f59e0b";
  const dc=data.diaCorte||1;
  const cA=useMemo(()=>getCiclo(dc,cOff),[dc,cOff]);
  const cC=useMemo(()=>getCiclo(dc,cmpOff),[dc,cmpOff]);

  const startT=()=>{const s=Date.now()-timer.elapsed*1000;timerRef.current=setInterval(()=>setTimer(t=>({...t,elapsed:Math.floor((Date.now()-s)/1000)})),1000);setTimer(t=>({...t,running:true}));};
  const stopT=()=>{clearInterval(timerRef.current);setTimer(t=>({...t,running:false}));setModal("ing");};
  const resetT=()=>{clearInterval(timerRef.current);setTimer({running:false,elapsed:0});};
  useEffect(()=>()=>clearInterval(timerRef.current),[]);

  const inR=(f,c)=>f>=c.desde&&f<=c.hasta;
  const iM=useMemo(()=>data.ing.filter(i=>i.empId===data.activeEmp&&inR(i.fecha,cA)),[data,cA]);
  const gM=useMemo(()=>data.gast.filter(g=>g.empId===data.activeEmp&&inR(g.fecha,cA)),[data,cA]);
  const iCmp=useMemo(()=>data.ing.filter(i=>i.empId===data.activeEmp&&inR(i.fecha,cC)),[data,cC]);
  const gCmp=useMemo(()=>data.gast.filter(g=>g.empId===data.activeEmp&&inR(g.fecha,cC)),[data,cC]);
  const iHoy=useMemo(()=>data.ing.filter(i=>i.fecha===todayISO&&i.empId===data.activeEmp),[data]);
  const ingActivo=useMemo(()=>data.ing.filter(i=>i.empId===data.activeEmp),[data.ing,data.activeEmp]);
  const abrirFicha=n=>setFicha(n);
  const abrirEdit=i=>{setEditItem(i);setModal("editIng");};
  const borrarIng=id=>{if(!window.confirm("¿Seguro que querés eliminar este ingreso?"))return;upd(d=>{d.ing=d.ing.filter(i=>i.id!==id);return d;});showToast("Eliminado","warn");};

  const calc=(ing,gast)=>{
    const tI=ing.reduce((s,i)=>s+i.monto,0),tG=gast.reduce((s,g)=>s+g.monto,0),tM=ing.reduce((s,i)=>s+i.duracion,0);
    const bd={},bs={},bsv={},bc={};
    DAYS_FULL.forEach(d=>bs[d]={monto:0,count:0,minutos:0});
    ing.forEach(i=>{
      const d=parseLocalDate(i.fecha),day=DAYS_FULL[d.getDay()];
      if(!bd[i.fecha])bd[i.fecha]={date:i.fecha,monto:0,count:0,minutos:0,feriado:isHol(i.fecha),finde:isWknd(i.fecha)};
      bd[i.fecha].monto+=i.monto;bd[i.fecha].count+=1;bd[i.fecha].minutos+=i.duracion;
      bs[day].monto+=i.monto;bs[day].count+=1;bs[day].minutos+=i.duracion;
      const s=i.servicio||"Sin especificar";if(!bsv[s])bsv[s]={monto:0,count:0,minutos:0};
      bsv[s].monto+=i.monto;bsv[s].count+=1;bsv[s].minutos+=i.duracion;

  const chip=(act,col)=>({flexShrink:0,padding:"7px 11px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",background:act?(col||ec):(isDark?"rgba(255,255,255,0.06)":"#eef1f6"),color:act?"#000":sub,border:"none"});
  const stat=(l,v,c)=>h("div",{key:l,style:{background:isDark?"rgba(255,255,255,0.04)":"#f6f8fb",borderRadius:12,padding:"10px 8px",minWidth:0}},
    h("div",{style:{fontSize:10,color:"#334155",textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}},l),
    h("div",{style:{fontFamily:"monospace",fontSize:16,fontWeight:700,color:c}},v));

    // caja de búsqueda

      busq.q&&h("button",{onClick:()=>set({q:""}),"aria-label":"Borrar búsqueda",style:{position:"absolute",right:6,top:6,width:32,height:32,borderRadius:10,border:"none",background:"transparent",color:sub,fontSize:16,cursor:"pointer"}},"✕")

// ════════ REVISAR CATEGORÍAS VIEJAS ════════
// Nada se guarda solo: cada botón guarda UN ingreso, y "Aplicar sugeridas" pide confirmación antes.
function RevisarCats({ing,ec,C,isDark,onBack,upd,showToast,onEdit}) {
  const h=React.createElement;
  const tx=isDark?"#e2e8f0":"#1e293b", sub="#64748b";
  const [pag,setPag]=useState(1);
  const info=useMemo(()=>ing.filter(i=>!i.categoria)
    .sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.hora||"").localeCompare(a.hora||""))
    .map(i=>({i,e:catEfectiva(i)})),[ing]);
  const unicas=info.filter(x=>x.e.k);
  const dudosas=info.filter(x=>!x.e.k&&x.e.dudas&&x.e.dudas.length>1);
  const sin=info.length-unicas.length-dudosas.length;

  const poner=(id,k)=>upd(d=>{d.ing=d.ing.map(i=>String(i.id)===String(id)?{...i,categoria:k}:i);return d;});
  const aplicar=()=>{
    if(!unicas.length) return;
    const por={}; unicas.forEach(x=>{por[x.e.k]=(por[x.e.k]||0)+1;});
    const detalle=CATS_ING.filter(c=>por[c.k]).map(c=>`${c.ic} ${c.k}: ${por[c.k]}`).join("\n");
    const ok=window.confirm(`Voy a guardar la categoría sugerida en ${unicas.length} ingresos:\n\n${detalle}\n\nLos ${dudosas.length+sin} restantes (con duda o sin sugerencia) no se tocan.\n\n¿Confirmás?`);
    if(!ok) return;
    const mapa=new Map(unicas.map(x=>[String(x.i.id),x.e.k]));
    upd(d=>{d.ing=d.ing.map(i=>(mapa.has(String(i.id))&&!i.categoria)?{...i,categoria:mapa.get(String(i.id))}:i);return d;});
    showToast(`Guardé ${unicas.length} categorías ✓`);
  };

  return h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    h("div",{style:{display:"flex",alignItems:"center",gap:8}},
      h("button",{onClick:onBack,"aria-label":"Volver",style:{width:38,height:38,borderRadius:12,border:C.bdr,background:"transparent",color:tx,fontSize:18,cursor:"pointer"}},"←"),
      h("div",null,h("div",{style:{fontSize:16,fontWeight:800,color:tx}},"Revisar categorías"),h("div",{style:{fontSize:11,color:sub}},`${info.length} ingresos sin categoría guardada`))
    ),
    h("div",{style:{background:C.card,border:C.bdr,borderRadius:16,padding:"12px 8px",fontSize:12,color:sub,lineHeight:1.5}},
      "Elegí la categoría de cada uno (se guarda al tocar). El borde punteado marca la que sugiere el nombre del servicio."),
    unicas.length>0&&h("button",{onClick:aplicar,style:{padding:"13px",borderRadius:12,border:"none",background:ec,color:"#000",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit"}},`Aplicar las ${unicas.length} sugeridas`),
    (dudosas.length+sin>0)&&unicas.length>0&&h("div",{style:{fontSize:11,color:sub,textAlign:"center"}},`${dudosas.length} con duda y ${sin} sin sugerencia: esos los elegís vos.`),
    info.length===0&&h("div",{style:{textAlign:"center",padding:"28px 8px",color:sub,fontSize:14}},"✅ Todos los ingresos tienen categoría."),
    info.slice(0,pag*30).map(({i,e})=>h("div",{key:i.id,style:{background:C.card,border:C.bdr,borderRadius:14,padding:"10px 8px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",gap:6}},
        h("div",{style:{minWidth:0}},
          h("div",{style:{color:tx,fontWeight:700,fontSize:14}},i.servicio||"Trabajo"),
          h("div",{style:{fontSize:11,color:sub,marginTop:2}},`${fmtDt(i.fecha)}${i.cliente?" · "+i.cliente:""}${i.nota?" · "+i.nota:""}`)
        ),
        h("span",{style:{fontFamily:"monospace",color:"#22c55e",fontWeight:700,fontSize:14,flexShrink:0}},fmtM(i.monto))
      ),
      h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}},
        CATS_ING.map(c=>{
          const sug=e.k===c.k||(e.dudas&&e.dudas.includes(c.k));
          return h("button",{key:c.k,onClick:()=>poner(i.id,c.k),style:{padding:"7px 10px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",background:sug?`rgba(${hr(c.c)},0.12)`:"transparent",color:sug?c.c:sub,border:sug?`1.5px dashed ${c.c}`:`1px solid ${isDark?"rgba(255,255,255,0.12)":"#d8dee8"}`}},`${c.ic} ${c.k}`);
        })
      ),
      (!e.k&&e.dudas&&e.dudas.length>1)&&h("div",{style:{fontSize:11,color:"#f59e0b",marginTop:6}},`Puede ser ${e.dudas.join(" o ")}: elegí vos.`),
      (!e.k&&(!e.dudas||e.dudas.length===0))&&h("div",{style:{fontSize:11,color:sub,marginTop:6}},"Sin sugerencia: elegí vos.")
    )),
    info.length>pag*30&&h("button",{onClick:()=>setPag(p=>p+1),style:{padding:"12px",borderRadius:12,border:C.bdr,background:"transparent",color:sub,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}},`Ver más (${info.length-pag*30} restantes)`)
  );
}

  const total=visitas.reduce((s,i)=>s+(Number(i.monto)||0),0);
  const ultima=visitas.length?visitas[0].fecha:"";
  const dias=ultima?Math.round((parseLocalDate(todayISO)-parseLocalDate(ultima))/864e5):null;
  const hace=dias===null?"":dias===0?"hoy":dias===1?"ayer":dias>1?`hace ${dias} días`:"";

        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}},
          card("Total gastado",fmtM(total),"#22c55e"),

        ),
        h("div",{style:{background:C.card,border:C.bdr,borderRadius:16,padding:"12px 8px"}},
          h("div",{style:{fontSize:11,color:"#334155",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}},"Lo que más se hace"),

              h("span",{style:{color:sub,flexShrink:0}},`×${s.n} · ${fmtM(s.t)}`)),
            h("div",{style:{height:6,background:"rgba(255,255,255,0.06)",borderRadius:3,overflow:"hidden"}},h("div",{style:{height:"100%",width:`${(s.n/maxN)*100}%`,background:ec,borderRadius:3}}))
          ))
        ),
        variantes.length>0&&h("div",{style:{fontSize:11,color:sub,lineHeight:1.5}},`Incluye visitas escritas de otra forma: ${variantes.join(", ")}.`),
        h("div",{style:{fontSize:11,color:"#334155",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginTop:4}},`Todas las visitas (${visitas.length})`),
        h("div",{style:{display:"flex",flexDirection:"column",gap:8}},visitas.map(i=>h(IC,{key:i.id,item:i,ec,onDel,onEdit,showDate:true})))
      )
  );
}

// ════════ TAB CLIENTES ════════
function TabClientes({stats,ec,C,isDark,onFicha}) {
  if(stats.length===0) return React.createElement("div",{style:{textAlign:"center",padding:"52px 4px"}},
    React.createElement("div",{style:{fontSize:48,marginBottom:12}},"👥"),
    React.createElement("div",{style:{fontSize:15,color:"#334155"}},"Sin clientes registrados"),
    React.createElement("div",{style:{fontSize:12,marginTop:6,color:"#1e3a5f"}},"Agregá el nombre del cliente al registrar un ingreso")
  );
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    React.createElement("div",{style:{fontSize:11,color:"#334155",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}},`${stats.length} clientes frecuentes · tocá una para ver su ficha`),
    stats.map((c,i)=>React.createElement("div",{key:c.nombre,onClick:()=>onFicha&&onFicha(c.nombre),style:{background:C.card,borderRadius:14,padding:"11px 4px",display:"flex",alignItems:"center",gap:6,border:C.bdr,cursor:"pointer"}},
      React.createElement("div",{style:{width:36,height:36,borderRadius:"50%",background:`rgba(${hr(ec)},0.15)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:ec,flexShrink:0}},i+1),
      React.createElement("div",{style:{flex:1}},
        React.createElement("div",{style:{color:"#e2e8f0",fontWeight:700,fontSize:15}},c.nombre),
        React.createElement("div",{style:{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}},
          React.createElement("span",{style:{fontSize:12,color:ec,fontWeight:700,fontFamily:"monospace"}},fmtM(c.total)),
          React.createElement("span",{style:{fontSize:12,color:"#334155"}},`${c.count} visitas`),
          React.createElement("span",{style:{fontSize:12,color:"#334155"}},`Última: ${fmtDt(c.ultima)}`)
        ),
        c.servicios.length>0&&React.createElement("div",{style:{fontSize:11,color:"#1e3a5f",marginTop:3}},c.servicios.slice(0,3).join(", "))
      )
    ))
  );
}

// ════════ TAB VS ════════
function TabVs({anM,anC,cA,cC,cmpOff,onSetCmp,dc,ec,C,isDark}) {
  const metrics=[
    {k:"tI",l:"Ingresos",f:fmtM,c:ec,inv:false},
    {k:"tG",l:"Gastos",f:fmtM,c:"#ef4444",inv:true},
    {k:"bal",l:"Balance",f:fmtM,c:"#22c55e",inv:false},
    {k:"tM",l:"Horas",f:fmtH,c:"#818cf8",inv:false},
    {k:"dT",l:"Días trabajados",f:String,c:"#f97316",inv:false},
  ];
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    React.createElement("div",{style:{background:C.card,borderRadius:20,padding:"12px",border:C.bdr}},
      React.createElement("div",{style:{fontSize:11,color:"#334155",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}},"Ciclo de comparación"),
      React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        [-1,-2,-3,-4,-5,-6].map(o=>{
          const c=getCiclo(dc,o);
          return React.createElement("button",{key:o,onClick:()=>onSetCmp(o),style:{padding:"7px 4px",borderRadius:20,cursor:"pointer",fontSize:11,fontWeight:700,background:cmpOff===o?ec:"rgba(255,255,255,0.06)",color:cmpOff===o?"#000":"#475569",border:"none",fontFamily:"inherit"}},lblCiclo(c));
        })
      )
    ),
    React.createElement("div",{style:{background:C.card,borderRadius:20,padding:"12px",border:C.bdr}},
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center",marginBottom:16}},
        React.createElement("div",{style:{textAlign:"center",padding:"8px",background:"rgba(255,255,255,0.03)",borderRadius:10}},
          React.createElement("div",{style:{fontSize:10,color:"#334155"}},"Comparando"),
          React.createElement("div",{style:{fontSize:13,fontWeight:900,color:ec}},lblCiclo(cC))
        ),
        React.createElement("div",{style:{fontSize:14,color:"#1e293b",textAlign:"center"}},"vs"),
        React.createElement("div",{style:{textAlign:"center",padding:"8px",background:`rgba(${hr(ec)},0.08)`,borderRadius:10,border:`1px solid ${ec}33`}},
          React.createElement("div",{style:{fontSize:10,color:"#334155"}},"Actual"),
          React.createElement("div",{style:{fontSize:13,fontWeight:900,color:ec}},lblCiclo(cA))
        )
      ),
      metrics.map(({k,l,f,c,inv})=>{
        const va=anC[k]||0,vb=anM[k]||0,p=pct(vb,va),mv=Math.max(va,vb,1);
        return React.createElement("div",{key:k,style:{marginBottom:14}},
          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}},
            React.createElement("span",{style:{color:"#334155"}},l),
            React.createElement("span",{style:{fontWeight:700,color:arrowClr(p,inv)}},arrowPct(p))
          ),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 4px 1fr",gap:6,alignItems:"center"}},
            React.createElement("div",{style:{textAlign:"right"}},
              React.createElement("div",{style:{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#334155"}},f(va)),
              React.createElement("div",{style:{height:5,background:"rgba(255,255,255,0.03)",borderRadius:3,marginTop:2}},
                React.createElement("div",{style:{height:"100%",width:`${(va/mv)*100}%`,background:c,opacity:0.35,borderRadius:3,marginLeft:"auto"}})
              )
            ),
            React.createElement("div",{style:{height:24,background:"#0f1826",borderRadius:2}}),
            React.createElement("div",null,
              React.createElement("div",{style:{fontFamily:"monospace",fontSize:12,fontWeight:700,color:c}},f(vb)),
              React.createElement("div",{style:{height:5,background:"rgba(255,255,255,0.03)",borderRadius:3,marginTop:2}},
                React.createElement("div",{style:{height:"100%",width:`${(vb/mv)*100}%`,background:c,borderRadius:3}})
              )
            )
          )
        );
      })
    )
  );
}

// ── Ingreso con Google ──
function Login(){
  const [error,setError]=useState("");
  const [cargando,setCargando]=useState(false);
  const entrar=async()=>{
    setError("");setCargando(true);
    const prov=new firebase.auth.GoogleAuthProvider();
    try{ await fauth.signInWithPopup(prov); }
    catch(e){
      if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){ await fauth.signInWithRedirect(prov); return; }
      if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") setError("No pude ingresar: "+(e.message||e.code));
    }
    setCargando(false);
  };
  return React.createElement("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:18,color:"#e2e8f0",textAlign:"center"}},
    React.createElement("img",{src:"rendix-icon-192.png",alt:"",style:{width:84,height:84,borderRadius:22}}),
    React.createElement("div",{style:{fontSize:28,fontWeight:800}},"Rendix"),
    React.createElement("div",{style:{fontSize:14,color:"#64748b",lineHeight:1.6,maxWidth:300}},"Ingresá con tu cuenta de Google para que tus datos queden guardados en la nube y sincronizados entre tus dispositivos."),
    React.createElement("button",{onClick:entrar,disabled:cargando,style:{marginTop:8,padding:"14px 22px",borderRadius:14,border:"none",background:"#f59e0b",color:"#080c14",fontWeight:800,fontSize:15,cursor:"pointer",opacity:cargando?0.6:1}},cargando?"Ingresando…":"Ingresar con Google"),
    error&&React.createElement("div",{style:{fontSize:12,color:"#ef4444",maxWidth:300}},error)
  );
}

function Root(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>fauth.onAuthStateChanged(u=>setUser(u||null)),[]);
  if(user===undefined) return React.createElement("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b"}},"Cargando…");
  if(!user) return React.createElement(Login);
  return React.createElement(App,{user,key:user.uid});
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));

</script>
