<body>
<div id="root"></div>
<!-- React carga primero, luego la app -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useMemo, useEffect, useRef, useCallback } = React;

const FERIADOS = new Set(["2025-01-01","2025-03-03","2025-03-04","2025-03-24","2025-04-02","2025-04-18","2025-04-19","2025-05-01","2025-05-25","2025-06-20","2025-07-09","2025-08-17","2025-10-12","2025-11-20","2025-12-08","2025-12-25","2026-01-01","2026-02-16","2026-02-17","2026-03-24","2026-04-02","2026-04-03","2026-04-04","2026-05-01","2026-05-25","2026-06-20","2026-07-09","2026-08-17","2026-10-12","2026-11-20","2026-12-08","2026-12-25"]);
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS_ES = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DAYS_FULL = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const GASTO_CATS = ["Materiales","Herramientas","Transporte","Publicidad","Servicios","Alquiler","Impuestos","Otros"];
const EMP_ICONS = {"💼":"Maletín","🪟":"Ventana","💅":"Uñas","🧵":"Costura","🎂":"Repostería","🧹":"Limpieza","💇":"Peluquería","🐾":"Mascotas","🍽️":"Comida","🌿":"Plantas","🚗":"Auto","💻":"Tech","👗":"Ropa","🎨":"Arte","🔧":"Herrería","📸":"Foto","🌸":"Flores","🧴":"Belleza","🏋️":"Fitness","✂️":"Corte"};
const PALETTE = ["#f59e0b","#ef4444","#8b5cf6","#3b82f6","#10b981","#ec4899","#f97316","#06b6d4","#84cc16","#e11d48","#a78bfa","#34d399"];

let _id = Date.now();
const uid = () => `r${_id++}`;
const fmtM = n => "$" + Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:0});
const fmtH = m => { if(!m) return "—"; const h=Math.floor(m/60),mm=m%60; return h>0?(mm>0?`${h}h ${mm}m`:`${h}h`):`${m}m`; };
const fmtDt = d => parseLocalDate(d).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
const todayISO = new Date().toISOString().slice(0,10);
const isoOf = d => d.toISOString().slice(0,10);
const isHol = d => FERIADOS.has(d);
const parseLocalDate = ds => { const [y,m,d]=ds.split("-").map(Number); return new Date(y,m-1,d); };
const isWknd = d => [0,6].includes(parseLocalDate(d).getDay());
const pct = (a,b) => b===0?null:Math.round(((a-b)/b)*100);
const arrowPct = p => p===null?"—":(p>0?`▲ ${p}%`:(p<0?`▼ ${Math.abs(p)}%`:"→ 0%"));
const arrowClr = (p,inv=false) => p===null?"#64748b":(p>0?(inv?"#ef4444":"#22c55e"):(p<0?(inv?"#22c55e":"#ef4444"):"#94a3b8"));
const hr = h => { try{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `${r},${g},${b}`;}catch{return "245,158,11";} };

const getCiclo = (dc,off=0) => {
  const hoy=new Date(),d=dc||1;
  const cut=new Date(hoy.getFullYear(),hoy.getMonth(),d);
  let ini=hoy>=cut?new Date(hoy.getFullYear(),hoy.getMonth(),d):new Date(hoy.getFullYear(),hoy.getMonth()-1,d);
  ini=new Date(ini); ini.setMonth(ini.getMonth()+off);
  const fin=new Date(ini); fin.setMonth(fin.getMonth()+1); fin.setDate(fin.getDate()-1);
  return {desde:isoOf(ini),hasta:isoOf(fin),ini,fin};
};
const lblCiclo = c => `${c.ini.getDate()}/${c.ini.getMonth()+1} — ${c.fin.getDate()}/${c.fin.getMonth()+1}`;

const INIT = {emps:[{id:"e1",nombre:"Mi Emprendimiento",color:"#f59e0b",icon:"💼",meta:0}],ing:[],gast:[],clientes:[],notas:{},activeEmp:"e1",onboarded:false,diaCorte:1,theme:"dark"};

// ── DONUT ────────────────────────────────────────────────────────────────────
function Donut({segs,size=130,sw=18}) {
  const r=(size-sw)/2,ci=2*Math.PI*r,tot=segs.reduce((s,g)=>s+g.v,0)||1;
  let off=0;
  return React.createElement("svg",{width:size,height:size,style:{transform:"rotate(-90deg)"}},
    React.createElement("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"rgba(255,255,255,0.06)",strokeWidth:sw}),
    ...segs.map((sg,i)=>{
      const dash=(sg.v/tot)*ci,gap=ci-dash;
      const el=React.createElement("circle",{key:i,cx:size/2,cy:size/2,r,fill:"none",stroke:sg.c,strokeWidth:sw,strokeDasharray:`${dash} ${gap}`,strokeDashoffset:-off,strokeLinecap:"round"});
      off+=dash; return el;
    })
  );
}

// ── AREA CHART ───────────────────────────────────────────────────────────────
function Area({data,color}) {
  if(!data||data.length<2) return null;
  const W=300,H=70,max=Math.max(...data.map(d=>d.v),1);
  const pts=data.map((d,i)=>({x:(i/(data.length-1))*W,y:H-((d.v/max)*(H-10))-5}));
  const line=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`C${pts[i-1].x+(pts[i].x-pts[i-1].x)/2},${pts[i-1].y} ${pts[i-1].x+(pts[i].x-pts[i-1].x)/2},${p.y} ${p.x},${p.y}`).join(" ");
  const area=`${line} L${W},${H} L0,${H} Z`;
  const id=`g${color.replace("#","")}`;
  return React.createElement("svg",{width:"100%",viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none",style:{display:"block"}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:color,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:color,stopOpacity:"0.02"})
      )
    ),
    React.createElement("path",{d:area,fill:`url(#${id})`}),
    React.createElement("path",{d:line,fill:"none",stroke:color,strokeWidth:"2.5",strokeLinecap:"round"}),
    ...pts.map((p,i)=>data[i].today?React.createElement("circle",{key:i,cx:p.x,cy:p.y,r:4,fill:color,stroke:"#080c14",strokeWidth:2}):null).filter(Boolean)
  );
}

// ════════════════════════════════════════════════════════════════════════════
function App() {
  const [data,setData]=useState(()=>{try{const s=localStorage.getItem("rendix_v5");return s?JSON.parse(s):INIT;}catch{return INIT;}});
  const [tab,setTab]=useState("inicio");
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [prefillDate,setPrefillDate]=useState(null);
  const [cOff,setCOff]=useState(0);
  const [cmpOff,setCmpOff]=useState(-1);
  const [toast,setToast]=useState(null);
  const [timer,setTimer]=useState({running:false,elapsed:0});
  const timerRef=useRef(null);

  useEffect(()=>{try{localStorage.setItem("rendix_v5",JSON.stringify(data));}catch{}},[data]);
  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2600);};
  const upd=useCallback(fn=>setData(p=>({...p,...fn({...p})})),[]);
  const emp=data.emps.find(e=>e.id===data.activeEmp)||data.emps[0];
  const isDark=data.theme!=="light";
  const ec=emp?.color||"#f59e0b";
  const dc=data.diaCorte||1;
  const cA=useMemo(()=>getCiclo(dc,cOff),[dc,cOff]);
  const cC=useMemo(()=>getCiclo(dc,cmpOff),[dc,cmpOff]);

  const startT=()=>{const s=Date.now()-timer.elapsed*1000;timerRef.current=setInterval(()=>setTimer(t=>({...t,elapsed:Math.floor((Date.now()-s)/1000)})),1000);setTimer(t=>({...t,running:true}));};
  const stopT=()=>{clearInterval(timerRef.current);setTimer(t=>({...t,running:false}));setModal("ing");};
  const resetT=()=>{clearInterval(timerRef.current);setTimer({running:false,elapsed:0});};
  useEffect(()=>()=>clearInterval(timerRef.current),[]);

  const inR=(f,c)=>f>=c.desde&&f<=c.hasta;
  const iM=useMemo(()=>data.ing.filter(i=>i.empId===data.activeEmp&&inR(i.fecha,cA)),[data,cA]);
  const gM=useMemo(()=>data.gast.filter(g=>g.empId===data.activeEmp&&inR(g.fecha,cA)),[data,cA]);
  const iCmp=useMemo(()=>data.ing.filter(i=>i.empId===data.activeEmp&&inR(i.fecha,cC)),[data,cC]);
  const gCmp=useMemo(()=>data.gast.filter(g=>g.empId===data.activeEmp&&inR(g.fecha,cC)),[data,cC]);
  const iHoy=useMemo(()=>data.ing.filter(i=>i.fecha===todayISO&&i.empId===data.activeEmp),[data]);

  const calc=(ing,gast)=>{
    const tI=ing.reduce((s,i)=>s+i.monto,0),tG=gast.reduce((s,g)=>s+g.monto,0),tM=ing.reduce((s,i)=>s+i.duracion,0);
    const bd={},bs={},bsv={},bc={};
    DAYS_FULL.forEach(d=>bs[d]={monto:0,count:0,minutos:0});
    ing.forEach(i=>{
      const d=parseLocalDate(i.fecha),day=DAYS_FULL[d.getDay()];
      if(!bd[i.fecha])bd[i.fecha]={date:i.fecha,monto:0,count:0,minutos:0,feriado:isHol(i.fecha),finde:isWknd(i.fecha)};
      bd[i.fecha].monto+=i.monto;bd[i.fecha].count+=1;bd[i.fecha].minutos+=i.duracion;
      bs[day].monto+=i.monto;bs[day].count+=1;bs[day].minutos+=i.duracion;
      const s=i.servicio||"Sin especificar";if(!bsv[s])bsv[s]={monto:0,count:0,minutos:0};
      bsv[s].monto+=i.monto;bsv[s].count+=1;bsv[s].minutos+=i.duracion;
    });
    gast.forEach(g=>{const c=g.categoria||"Otros";if(!bc[c])bc[c]={monto:0,count:0};bc[c].monto+=g.monto;bc[c].count+=1;});
    const dA=Object.values(bd).sort((a,b)=>b.monto-a.monto),sA=Object.entries(bsv).sort((a,b)=>b[1].count-a[1].count),dT=Object.keys(bd).length;
    let ra=0;const hoy=new Date(todayISO);
    for(let i=0;i<60;i++){const d=new Date(hoy);d.setDate(d.getDate()-i);if(bd[isoOf(d)])ra++;else break;}
    return {tI,tG,bal:tI-tG,tM,ph:tM>0?(tI/(tM/60)):0,dA,bs,sA,bc,dT,promD:dT>0?tI/dT:0,ra,ferT:dA.filter(d=>d.feriado).length};
  };
  const anM=useMemo(()=>calc(iM,gM),[iM,gM]);
  const anC=useMemo(()=>calc(iCmp,gCmp),[iCmp,gCmp]);

  // clientes
  const clientesStats=useMemo(()=>{
    const map={};
    data.ing.filter(i=>i.empId===data.activeEmp&&i.cliente).forEach(i=>{
      if(!map[i.cliente])map[i.cliente]={nombre:i.cliente,total:0,count:0,servicios:new Set(),ultima:""};
      map[i.cliente].total+=i.monto;map[i.cliente].count+=1;
      if(i.servicio)map[i.cliente].servicios.add(i.servicio);
      if(!map[i.cliente].ultima||i.fecha>map[i.cliente].ultima)map[i.cliente].ultima=i.fecha;
    });
    return Object.values(map).sort((a,b)=>b.total-a.total).map(c=>({...c,servicios:[...c.servicios]}));
  },[data]);

    const proj=useMemo(()=>{
    const hoy=new Date(),dT=Math.round((cA.fin-cA.ini)/(864e5))+1,dTr=Math.max(1,Math.round((hoy-cA.ini)/(864e5))+1);
    return anM.tI>0?Math.round((anM.tI/dTr)*dT):null;
  },[anM,cA]);

  const logros=useMemo(()=>{
    const a=[];
    if(anM.ra>=3)a.push({icon:"🔥",label:`${anM.ra} días seguidos`,c:"#f97316"});
    if(anM.ferT>0)a.push({icon:"🎉",label:`${anM.ferT} feriado${anM.ferT>1?"s":""} trabajado${anM.ferT>1?"s":""}`,c:"#ef4444"});
    if(emp?.meta>0&&anM.tI>=emp.meta)a.push({icon:"🎯",label:"¡Meta alcanzada!",c:"#22c55e"});
    if(anM.tI>anC.tI&&anC.tI>0)a.push({icon:"📈",label:"Mejor que el ciclo anterior",c:"#3b82f6"});
    if(anM.dT>=20)a.push({icon:"💪",label:"20+ días trabajados",c:"#10b981"});
    return a;
  },[anM,anC,emp]);

  const areaD=useMemo(()=>{
    const dias=Math.round((cA.fin-cA.ini)/(864e5))+1;
    const bd={};iM.forEach(i=>{if(!bd[i.fecha])bd[i.fecha]=0;bd[i.fecha]+=i.monto;});
    return Array.from({length:Math.min(dias,31)},(_,i)=>{const d=new Date(cA.ini);d.setDate(d.getDate()+i);const ds=isoOf(d);return {v:bd[ds]||0,today:ds===todayISO};});
  },[iM,cA]);

    // ── Resumen semanal ──────────────────────────────────────────────────────
  const semanaData = useMemo(()=>{
    const hoy = parseLocalDate(todayISO);
    const diaSem = hoy.getDay(); // 0=dom, 1=lun...
    // lunes de esta semana
    const diffLun = diaSem === 0 ? -6 : 1 - diaSem;
    const lunes = new Date(hoy); lunes.setDate(hoy.getDate() + diffLun);
    const sabado = new Date(lunes); sabado.setDate(lunes.getDate() + 5);
    const dias = [];
    for(let i=0;i<6;i++){
      const d = new Date(lunes); d.setDate(lunes.getDate()+i);
      const ds = isoOf(d);
      const ingDia = data.ing.filter(i=>i.fecha===ds&&i.empId===data.activeEmp);
      dias.push({
        ds, label: DAYS_FULL[d.getDay()].slice(0,3),
        monto: ingDia.reduce((s,i)=>s+i.monto,0),
        count: ingDia.length,
        minutos: ingDia.reduce((s,i)=>s+i.duracion,0),
        esHoy: ds===todayISO,
        esFuturo: d>hoy,
        feriado: isHol(ds),
      });
    }
    const totalSemana = dias.reduce((s,d)=>s+d.monto,0);
    const horasSemana = dias.reduce((s,d)=>s+d.minutos,0);
    const diasTrabSemana = dias.filter(d=>d.count>0).length;
    const mejorDia = dias.reduce((best,d)=>d.monto>best.monto?d:best, dias[0]);
    return {dias, totalSemana, horasSemana, diasTrabSemana, mejorDia,
      desde: isoOf(lunes), hasta: isoOf(sabado)};
  },[data, todayISO]);

  if(!data.onboarded) return React.createElement(Onboard,{onDone:n=>upd(d=>{d.emps=[{id:"e1",nombre:n,color:"#f59e0b",icon:"💼",meta:0}];d.activeEmp="e1";d.onboarded=true;return d;})});

  const C = {
    bg:isDark?"#080c14":"#f4f6fa",
    card:isDark?"rgba(255,255,255,0.05)":"#ffffff",
    bdr:isDark?"1px solid rgba(255,255,255,0.07)":"1px solid #e8ecf2",
    r:18
  };

  const tabs=[["inicio","🏠","Inicio"],["gastos","💸","Gastos"],null,["cal","📅","Agenda"],["stats","📊","Stats"],["clientes","👥","Clientes"],["vs","🔀","Comparar"],["config","⚙️","Ajustes"]];

  return React.createElement("div",{style:{fontFamily:"'Sora',system-ui,sans-serif",background:C.bg,minHeight:"100vh",color:"#e2e8f0",maxWidth:430,margin:"0 auto",paddingBottom:88}},

    // HEADER
    React.createElement("header",{style:{padding:"52px 20px 14px",background:`linear-gradient(180deg,rgba(${hr(ec)},0.14) 0%,transparent 100%)`}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}},
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:13,color:"#64748b",marginBottom:3}},`Hola, ${emp?.nombre.split(" ")[0]} 👋`),
          React.createElement("div",{style:{fontSize:22,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}},emp?.nombre)
        ),
        React.createElement("div",{style:{display:"flex",gap:7,alignItems:"center"}},
          data.emps.length>1&&data.emps.map(e=>
            React.createElement("button",{key:e.id,onClick:()=>upd(d=>{d.activeEmp=e.id;return d;}),title:e.nombre,style:{width:38,height:38,borderRadius:12,border:`2px solid ${data.activeEmp===e.id?e.color:"rgba(255,255,255,0.1)"}`,background:`rgba(${hr(e.color)},0.15)`,cursor:"pointer",fontSize:19,display:"flex",alignItems:"center",justifyContent:"center"}},e.icon||"💼")
          ),
          React.createElement("button",{onClick:()=>setModal("emp"),style:{width:38,height:38,borderRadius:12,border:"1px dashed rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.03)",cursor:"pointer",color:"#64748b",fontSize:19,display:"flex",alignItems:"center",justifyContent:"center"}},"＋"),
          React.createElement("button",{onClick:()=>upd(d=>{d.theme=d.theme==="dark"?"light":"dark";return d;}),style:{width:38,height:38,borderRadius:12,border:`1px solid ${isDark?"rgba(255,255,255,0.08)":"#e2e8f0"}`,background:isDark?"rgba(255,255,255,0.03)":"#f1f5f9",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}},isDark?"☀️":"🌙")
        )
      ),
      // ciclo nav
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.05)",borderRadius:14,padding:"9px 14px",border:C.bdr,marginBottom:emp?.meta>0?12:0}},
        React.createElement("button",{onClick:()=>setCOff(o=>o-1),style:{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:20,padding:"0 2px"}},"‹"),
        React.createElement("div",{style:{flex:1,textAlign:"center"}},
          React.createElement("div",{style:{fontSize:13,fontWeight:700,color:"#fff"}},lblCiclo(cA)),
          React.createElement("div",{style:{fontSize:11,color:"#334155"}},cOff===0?"Ciclo actual":cOff===-1?"Ciclo anterior":`Hace ${Math.abs(cOff)} ciclos`)
        ),
        React.createElement("button",{onClick:()=>setCOff(o=>Math.min(0,o+1)),style:{background:"none",border:"none",color:cOff===0?"#1e293b":"#64748b",cursor:"pointer",fontSize:20,padding:"0 2px",opacity:cOff===0?0.15:1}},"›"),
        cOff!==0&&React.createElement("button",{onClick:()=>setCOff(0),style:{fontSize:11,color:ec,background:`rgba(${hr(ec)},0.15)`,border:"none",borderRadius:10,padding:"3px 9px",cursor:"pointer",fontWeight:700}},"Hoy")
      ),
      // meta bar
      emp?.meta>0&&React.createElement("div",null,
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,color:"#334155",marginBottom:4}},
          React.createElement("span",null,"Meta del ciclo"),
          React.createElement("span",{style:{color:anM.tI>=emp.meta?"#22c55e":ec,fontWeight:700}},`${Math.min(100,Math.round((anM.tI/emp.meta)*100))}%`)
        ),
        React.createElement("div",{style:{height:5,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden"}},
          React.createElement("div",{style:{height:"100%",width:`${Math.min(100,(anM.tI/emp.meta)*100)}%`,background:ec,borderRadius:3,transition:"width 1s ease"}})
        )
      )
    ),

    // LOGROS
    logros.length>0&&React.createElement("div",{style:{display:"flex",gap:8,overflowX:"auto",padding:"0 20px 10px"}},
      logros.map((l,i)=>React.createElement("div",{key:i,style:{display:"flex",alignItems:"center",gap:6,background:`rgba(${hr(l.c)},0.12)`,border:`1px solid rgba(${hr(l.c)},0.2)`,borderRadius:20,padding:"5px 12px",flexShrink:0}},
        React.createElement("span",{style:{fontSize:14}},l.icon),
        React.createElement("span",{style:{fontSize:12,color:l.c,fontWeight:700,whiteSpace:"nowrap"}},l.label)
      ))
    ),

    // TIMER
    (tab==="inicio"||timer.running)&&React.createElement("div",{style:{margin:"0 20px 10px",background:"rgba(255,255,255,0.04)",borderRadius:14,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,border:C.bdr}},
      React.createElement("span",{style:{fontSize:14,color:"#475569"}},"⏱"),
      React.createElement("div",{style:{fontFamily:"monospace",fontWeight:700,fontSize:18,color:timer.running?ec:"#1e3a5f",minWidth:76}},
        `${String(Math.floor(timer.elapsed/3600)).padStart(2,"0")}:${String(Math.floor((timer.elapsed%3600)/60)).padStart(2,"0")}:${String(timer.elapsed%60).padStart(2,"0")}`
